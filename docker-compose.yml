services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alchemy-postgres
    environment:
      POSTGRES_USER: alchemy
      POSTGRES_PASSWORD: alchemy
      POSTGRES_DB: alchemy
    ports:
      - "5433:5432"
    volumes:
      - alchemy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alchemy -d alchemy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alchemy_pg_data:
